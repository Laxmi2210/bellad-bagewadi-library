<!DOCTYPE html>
<html>

<head>

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="page">

    <nav>

        <a href="{{ url_for('dashboard') }}">📊 Dashboard</a>

        <a href="{{ url_for('students') }}">👨‍🎓 Students</a>

        <a href="{{ url_for('books') }}">📚 Books</a>

        <a href="{{ url_for('issue_return') }}">
            📤📥 Issue / Return
        </a>

        <a href="{{ url_for('history') }}">
            📜 History
        </a>

    </nav>


    <div class="form-box">

        <h1>✏️ Edit Student</h1>

        <form method="POST">

            <label>Student Name</label>

            <input
                type="text"
                name="name"
                value="{{ student['name'] }}"
                required
            >


            <label>Mobile Number</label>

            <input
                type="text"
                name="mobile"
                value="{{ student['mobile'] or '' }}"
            >


            <label>Address</label>

            <input
                type="text"
                name="address"
                value="{{ student['address'] or '' }}"
            >


            <button type="submit">
                💾 Update Student
            </button>

        </form>

        <br>

        <a href="{{ url_for('students') }}">
            ← Back to Students
        </a>

    </div>

</div>

</body>

</html>
